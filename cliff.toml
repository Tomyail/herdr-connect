# Configuration for git-cliff, used only to render the "What's Changed" body
# of each GitHub Release (see the "Generate release notes with git-cliff"
# step in .github/workflows/daemon-release.yml, run with `--latest` so it
# only covers the release currently being published).
#
# This is unrelated to CHANGELOG.md, which stays hand-curated, user-facing
# prose maintained separately by the release author.
#
# https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | upper_first }}
{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true
render_always = true

[git]
conventional_commits = true
# Keep every commit regardless of whether it parses as a conventional commit:
# anything that doesn't match a parser below still falls through to the
# catch-all "Other" group instead of being dropped. That's the point of using
# git-cliff here — `gh release create --generate-notes` only surfaces commits
# that came in through a merged pull request.
filter_unconventional = false
filter_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "CI" },
  { message = "^chore", group = "Miscellaneous Tasks" },
  { message = "^revert", group = "Revert" },
  { message = ".*", group = "Other" },
]
topo_order = false
sort_commits = "oldest"
tag_pattern = "^v[0-9]"
